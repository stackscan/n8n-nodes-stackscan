# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# npm cannot create a package through OIDC, so version 0.1.0 goes up by hand
# once. Everything after that is this workflow.
#
# On npmjs.com, open the package settings and under Publish access, Trusted
# Publishers, add a publisher:
#     Repository owner: stackscan
#     Repository name:  n8n-nodes-stackscan
#     Workflow name:    publish.yml
#     Environment:      leave blank
#
# No repository secret is needed and none should be added. Authentication is
# the OIDC exchange, so there is no long lived token to leak or rotate.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag and push, which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Release
        # Publishes with a provenance attestation, which needs the
        # id-token: write permission above. Lint and build run as part of it.
        #
        # No NPM_TOKEN. Authentication is the OIDC exchange against the
        # Trusted Publisher configured on the package, so no long lived secret
        # exists in this repository to leak or rotate.
        #
        # The scaffold shipped a token fallback here whose env value was a
        # bare "$" rather than a secrets reference. That is a non-empty
        # string, so its guard passed, npm was handed "$" as an auth token and
        # the OIDC path never ran. Removed rather than repaired: with Trusted
        # Publishing there is nothing for it to do.
        run: npm run release
